name: ADS Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test DVC Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tool
        run: python -m pip install flake8

      - name: Run Flake8
        run: flake8 tests

  dvc:
    name: Validate DVC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DVC
        run: python -m pip install dvc

      - name: Show DVC version
        run: dvc --version

      - name: Check DVC status
        run: dvc status

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [test, lint, dvc]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python files
        run: python -m compileall tests

  deploy:
    name: Deployment Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deployment status
        run: echo "CI/CD pipeline passed. Deployment gate is ready."
